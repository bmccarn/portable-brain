schema_version: 1
spec_version: '0.1'
okf_version: '0.2'
default_actor: human:owner
domains: []
modules: []
groups:
  inbox:
    description: Ungated front door; anything may land here and leaves when triaged.
    strict: false
  sources:
    description: Faithful, traceable source material.
    strict: true
  wiki:
    description: Maintained synthesis and durable understanding.
    strict: false
  journal:
    description: Append-only chronological continuity.
    strict: true
workflow:
  states:
    active: Active
    blocked: Blocked
    parked: Parked
    done: Done
    dropped: Dropped
  initial_state: active
  closed_states:
  - done
  - dropped
  requires_blocked_on:
  - blocked
types:
  Source:
    group: sources
    folder: .
    workflow: false
    sections:
    - Citation
    - Source material
    - Notes
  Concept:
    group: wiki
    folder: .
    workflow: false
    sections:
    - Summary
    - Notes
    - References
  Person:
    group: wiki
    folder: .
    workflow: false
    sections:
    - Summary
    - Notes
    - References
  Place:
    group: wiki
    folder: .
    workflow: false
    sections:
    - Summary
    - Notes
    - References
  Organization:
    group: wiki
    folder: .
    workflow: false
    sections:
    - Summary
    - Notes
    - References
  Theme:
    group: wiki
    folder: .
    workflow: false
    sections:
    - Summary
    - Notes
    - References
  Event:
    group: wiki
    folder: .
    workflow: false
    sections:
    - Summary
    - Notes
    - References
  Journal:
    group: journal
    folder: .
    workflow: false
    sections: []
adapters:
- claude
- obsidian
